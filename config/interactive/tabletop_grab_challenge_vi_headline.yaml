    position_m: [1.80, 2.90, 1.78]
    look_at_m: [0.04, 0.56, 0.82]
    width: 640
    height: 360
    fov_deg: 54.0
  - name: side_overwatch
    position_m: [-2.25, 1.55, 1.42]
    look_at_m: [0.04, 0.54, 0.82]
    width: 640
    height: 360
    fov_deg: 50.0
  - name: top_oblique
